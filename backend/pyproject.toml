[project]
name = "backend"
version = "0.1.0"
description = "SQL Hub API — FastAPI + Postgres"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.0",
    "bcrypt==4.0.1",
    "fastapi>=0.123.9",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
